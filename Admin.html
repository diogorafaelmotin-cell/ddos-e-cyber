<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - CyberShield</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0a0a0a;color:#fff;font-family:system-ui}.card{background:#161616;border:1px solid #2a2a2a;border-radius:12px;padding:1rem}.input{width:100%;padding:.8rem;border-radius:10px;background:#000;border:1px solid #2a2a2a;color:#fff}.btn{background:#00BFFF;color:#000;font-weight:800;padding:.8rem;border-radius:10px;width:100%;border:none}</style></head><body>
<div id="v-login" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem"><div style="width:100%;max-width:360px"><h1 style="text-align:center;font-size:24px;font-weight:800">🔐 Admin CyberShield</h1><p style="text-align:center;color:#777;margin:8px 0 20px">Acesso restrito</p><div class="card"><form onsubmit="adminLogin(event)" style="display:flex;flex-direction:column;gap:12px"><input id="ae" type="email" required class="input" placeholder="seu email admin"><input id="ap" type="password" required class="input" placeholder="senha admin"><button class="btn">Entrar no Painel</button><p id="am" style="text-align:center;color:#ff7777"></p></form></div></div></div>
<div id="v-panel" style="display:none;padding:20px;max-width:800px;margin:0 auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><h1 style="font-size:24px;font-weight:800">📊 Painel - Quem Logou</h1><button onclick="logout()" style="padding:8px 12px;border-radius:8px;border:1px solid #ff444433;color:#ff7777;background:none">Sair</button></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px"><div class="card"><p style="color:#777;font-size:12px">Total Logins</p><p id="total" style="font-size:24px;font-weight:800;color:#00BFFF">0</p></div><div class="card"><p style="color:#777;font-size:12px">Último Login</p><p id="last" style="font-size:14px">-</p></div><div class="card"><p style="color:#777;font-size:12px">Link do Site</p><a href="index.html" style="color:#00BFFF;font-size:14px">Ver Site</a></div></div><div class="card"><h3 style="font-weight:700;margin-bottom:12px">📝 Histórico de Acessos</h3><div id="logs" style="display:flex;flex-direction:column;gap:8px;max-height:400px;overflow:auto"></div></div><button onclick="clearLogs()" style="margin-top:16px;width:100%;padding:10px;border-radius:8px;background:#ff444422;color:#ff7777;border:1px solid #ff444433">🗑️ Limpar Histórico</button></div>
<script>
const ADMIN_EMAIL = "diogo@admin.com"; // <-- MUDA PRA SEU EMAIL
const ADMIN_PASS = "admff"; // <-- MUDA SUA SENHA SECRETA

function adminLogin(e){
  e.preventDefault();
  let em=document.getElementById('ae').value.trim().toLowerCase();
  let p=document.getElementById('ap').value;
  if(em===ADMIN_EMAIL && p===ADMIN_PASS){
    localStorage.setItem('cs_admin','1');
    showPanel();
  } else {
    document.getElementById('am').innerText='❌ Email ou senha errada';
  }
}
function showPanel(){
  document.getElementById('v-login').style.display='none';
  document.getElementById('v-panel').style.display='block';
  loadLogs();
}
function loadLogs(){
  let logs=JSON.parse(localStorage.getItem('cs_logs')||'[]');
  document.getElementById('total').innerText=logs.length;
  if(logs.length>0){
    let l=logs[logs.length-1];
    document.getElementById('last').innerText=l.email+' - '+new Date(l.time).toLocaleString('pt-BR');
  }
  let html='';
  logs.slice().reverse().forEach(log=>{
    html+=`<div style="padding:10px;background:#0a0a0a;border-radius:8px;border:1px solid #222;display:flex;justify-content:space-between"><div><b style="color:#00BFFF">${log.email}</b><br><span style="font-size:12px;color:#777">${log.name} - ${new Date(log.time).toLocaleString('pt-BR')}</span></div><span style="font-size:11px;color:#555">${log.ip}</span></div>`;
  });
  document.getElementById('logs').innerHTML = html || '<p style="color:#777">Nenhum login ainda</p>';
}
function clearLogs(){if(confirm('Apagar tudo?')){localStorage.removeItem('cs_logs');loadLogs();}}
function logout(){localStorage.removeItem('cs_admin');location.reload();}
if(localStorage.getItem('cs_admin')) showPanel();
</script></body></html>
